# Runs the bot and the web dashboard as two containers sharing one SQLite
# database via a named volume. Requires a filled-in .env (see .env.example).
#
# Usage:
#   docker compose up -d --build       # start both services
#   docker compose logs -f bot         # tail bot logs
#   docker compose run --rm bot npm run deploy:global   # one-off command deploy

services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    container_name: lavalink
    restart: unless-stopped
    env_file: .env
    environment:
      - _JAVA_OPTIONS=${LAVALINK_JAVA_OPTS:--Xmx1G}
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD}
      - SERVER_PORT=2333
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ./lavalink/plugins:/opt/Lavalink/plugins
      - lavalink-logs:/opt/Lavalink/logs
    ports:
      # Bound to loopback only for local development
      # For production, bind to specific interface or use reverse proxy
      - "127.0.0.1:2333:2333"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2333/version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  bot:
    build: .
    image: discord-management-bot:latest
    command: ["node", "shard.js"]
    env_file: .env
    depends_on:
      - lavalink
    volumes:
      - bot-data:/app/data
    restart: unless-stopped
    # ── Container hardening ────────────────────────────────────────────────
    read_only: true          # root filesystem is immutable except mounts below
    tmpfs:
      - /tmp                 # writable scratch space some npm packages expect
    cap_drop: ["ALL"]        # no Linux capabilities beyond the bare minimum
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          memory: 512M
    # Sharding means multiple gateway connections — give it a moment to
    # settle before Docker considers a restart loop unhealthy.
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build: .
    image: discord-management-bot:latest
    command: ["node", "web/server.js"]
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    volumes:
      - bot-data:/app/data
    restart: unless-stopped
    depends_on:
      - bot
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bot-data:
  lavalink-logs:
