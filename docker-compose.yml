# Runs the bot and the web dashboard as two containers sharing one SQLite
# database via a named volume. Requires a filled-in .env (see .env.example).
#
# Usage:
#   docker compose up -d --build       # start both services
#   docker compose logs -f bot         # tail bot logs
#   docker compose run --rm bot npm run deploy:global   # one-off command deploy

services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    container_name: lavalink
    restart: unless-stopped
    env_file: .env   # application.yml pulls LAVALINK_PASSWORD / SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET from here
    environment:
      - _JAVA_OPTIONS=${LAVALINK_JAVA_OPTS:--Xmx1G}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ./lavalink/plugins:/opt/Lavalink/plugins
      - lavalink-logs:/opt/Lavalink/logs
    ports:
      # Bound to loopback only — this is deliberate. Nothing outside the
      # VPS itself should reach Lavalink directly; the Cloudflare Tunnel
      # (cloudflared, running on the host, see docs/VPS_DEPLOY_GUIDE.md)
      # is what makes lavalink.shanufx.dev work, by forwarding through
      # this loopback port. Do NOT change this to "2333:2333" (all
      # interfaces) unless you have a specific reason to expose it
      # publicly without the tunnel.
      - "127.0.0.1:2333:2333"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2333/version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1.5G

  bot:
    build: .
    image: discord-management-bot:latest
    command: ["node", "shard.js"]
    env_file: .env
    depends_on:
      - lavalink
    volumes:
      - bot-data:/app/data
    restart: unless-stopped
    # ── Container hardening ────────────────────────────────────────────────
    read_only: true          # root filesystem is immutable except mounts below
    tmpfs:
      - /tmp                 # writable scratch space some npm packages expect
    cap_drop: ["ALL"]        # no Linux capabilities beyond the bare minimum
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          memory: 512M
    # Sharding means multiple gateway connections — give it a moment to
    # settle before Docker considers a restart loop unhealthy.
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build: .
    image: discord-management-bot:latest
    command: ["node", "web/server.js"]
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    volumes:
      - bot-data:/app/data
    restart: unless-stopped
    depends_on:
      - bot
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bot-data:
  lavalink-logs:
