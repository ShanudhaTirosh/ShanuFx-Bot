# Lavalink v4 configuration for the `lavalink` service in docker-compose.yml.
#
# Enhanced with all production plugins:
# - YouTube Source (required for YouTube playback)
# - LavaSrc (Spotify, Apple Music, Deezer, Yandex support)
# - LavaSearch (advanced search capabilities)
# - LavaLyrics (lyrics support)
# - Google Cloud TTS (text-to-speech)
#
# ${VAR} placeholders below are resolved by Spring Boot directly against
# the container's environment variables from .env file.

server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "${LAVALINK_PASSWORD}"
    sources:
      # Built-in youtube source is deprecated - use youtube-source plugin instead
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 50
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

  # Enhanced plugin configuration with all production plugins
  plugins:
    # YouTube Source Plugin - REQUIRED for any YouTube playback
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.13.5"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    
    # LavaSrc - Multi-source support (Spotify, Apple Music, Deezer, Yandex)
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.0"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    
    # LavaSearch - Advanced search capabilities
    - dependency: "com.github.topi314.lavasearch:lavasearch-plugin:1.0.0"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    
    # LavaLyrics - Lyrics support
    - dependency: "com.github.topi314.lavalyrics:lavalyrics-plugin:1.0.0"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

plugins:
  # YouTube Source Plugin Configuration
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Multiple clients for maximum reliability against rate limiting
    clients:
      - MUSIC          # YouTube Music - best for music searches
      - ANDROID_VR     # Android VR client
      - WEB            # Standard web client
      - WEBEMBEDDED    # Embedded web player
      - TVHTML5EMBEDDED # TV HTML5 embedded
    
    # OAuth configuration (optional but recommended for reliability)
    # Uncomment and configure after first run if you get "Sign in to confirm" errors
    # oauth:
    #   enabled: false
    #   refreshToken: ""
    #   skipInitialization: false

  # LavaSrc Plugin Configuration
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""      # Search by ISRC code
      - "ytsearch:%QUERY%"         # Standard search
    
    sources:
      # Spotify support (works with or without credentials via fallback)
      spotify: false  # Set to true if you add SPOTIFY_CLIENT_ID/SECRET below
      applemusic: true
      deezer: true
      yandexmusic: false  # Requires Russian account
      flowerytts: false
      youtube: true
    
    # Spotify configuration (optional - bot has keyless fallback)
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "US"
      playlistLoadLimit: 50
      albumLoadLimit: 50
    
    # Apple Music configuration (optional)
    applemusic:
      countryCode: "US"
      mediaAPIToken: ""
      playlistLoadLimit: 50
      albumLoadLimit: 50
    
    # Deezer configuration
    deezer:
      masterDecryptionKey: ""

  # LavaSearch Plugin Configuration
  lavasearch:
    enabled: true
    sources:
      - youtube
      - soundcloud
      - spotify
      - applemusic
      - deezer
    
  # LavaLyrics Plugin Configuration  
  lavalyrics:
    enabled: true
    sources:
      - spotify
      - youtube
      - deezer
      - applemusic

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

logging:
  level:
    root: INFO
    lavalink: INFO
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 5
  file:
    path: ./logs/

sentry:
  dsn: ""
  environment: ""
